name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: scheduling_test
          POSTGRES_USER: scheduling
          POSTGRES_PASSWORD: scheduling
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scheduling"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DEBUG: "True"
      SECRET_KEY: django-insecure-ci
      DATABASE_URL: postgres://scheduling:scheduling@localhost:5432/scheduling_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Check migrations are up to date
        working-directory: api
        run: python manage.py makemigrations --check --dry-run
      - name: Test with coverage
        working-directory: api
        run: |
          coverage run --source=. --omit="*/migrations/*,*/tests*.py,manage.py,api/wsgi.py,api/asgi.py" manage.py test
          coverage report --fail-under=65
      - name: Test with Redis broker settings (Celery non-eager)
        working-directory: api
        env:
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py check
      - name: Deployment checks
        working-directory: api
        env:
          DEBUG: "False"
          SECRET_KEY: ci-deploy-check-${{ github.run_id }}-0123456789abcdefghijklmnopqrstuvwxyz
          ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy --fail-level WARNING

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - name: i18n message consistency (8 locales)
        run: node scripts/check-messages.mjs
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - working-directory: front
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - working-directory: front
        run: npx playwright test
        env:
          CI: "true"
          E2E_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: front/playwright-report
          retention-days: 7

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm test

  docker:
    name: Docker images & compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          cp .env.docker.example .env
          docker compose config -q
          docker compose --profile sso config -q
          sed -e 's/^DJANGO_SECRET_KEY=$/DJANGO_SECRET_KEY=ci/' -e 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/'               -e 's/^INTERNAL_API_TOKEN=$/INTERNAL_API_TOKEN=ci/' .env.production.example > .env.production
          docker compose -f docker-compose.prod.yml --env-file .env.production --profile worker --profile sso config -q
      - name: Build API image
        run: docker build -f Dockerfile.api -t scheduling-api .
      - name: Build frontend image
        run: docker build --target runner --build-arg NEXT_PUBLIC_SITE_URL=https://example.com -t scheduling-front front
