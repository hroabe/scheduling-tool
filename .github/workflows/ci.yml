name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: scheduling_test
          POSTGRES_USER: scheduling
          POSTGRES_PASSWORD: scheduling
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scheduling"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DEBUG: "True"
      SECRET_KEY: django-insecure-ci
      DATABASE_URL: postgres://scheduling:scheduling@localhost:5432/scheduling_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Check migrations are up to date
        working-directory: api
        run: python manage.py makemigrations --check --dry-run
      - name: Test with coverage
        working-directory: api
        run: |
          coverage run --source=schedule --omit="schedule/migrations/*,schedule/tests.py,schedule/serializer.py,schedule/filters.py" manage.py test schedule
          coverage report --fail-under=65
      - name: Deployment checks
        working-directory: api
        env:
          DEBUG: "False"
          SECRET_KEY: ci-deploy-check-${{ github.run_id }}-0123456789abcdefghijklmnopqrstuvwxyz
          ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy --fail-level WARNING

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - working-directory: front
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - working-directory: front
        run: npx playwright test
        env:
          CI: "true"
          E2E_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: front/playwright-report
          retention-days: 7
