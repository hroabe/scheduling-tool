version: '3.8'

services:
  # Nginx Reverse Proxy (RFC-0007)
  nginx:
    image: nginx:alpine
    container_name: scheduling-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - front
    restart: unless-stopped

  # PostgreSQL Database (internal only - no external port binding)
  db:
    image: postgres:15-alpine
    container_name: scheduling-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scheduling_db}
      POSTGRES_USER: ${POSTGRES_USER:-scheduling}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    # No ports exposed to host - internal network only
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scheduling} -d ${POSTGRES_DB:-scheduling_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (internal only - no external port binding)
  redis:
    image: redis:7-alpine
    container_name: scheduling-redis
    # No ports exposed to host - internal network only
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend (internal only - accessed via nginx)
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: scheduling-api
    volumes:
      - ./api:/app
    # No ports exposed to host - accessed via nginx
    expose:
      - "8000"
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DATABASE_URL: "postgres://${POSTGRES_USER:-scheduling}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-scheduling_db}"
      REDIS_URL: "redis://redis:6379/0"
      ALLOWED_HOSTS: "localhost,127.0.0.1,api,nginx"
      CORS_ALLOWED_ORIGINS: "http://localhost,http://127.0.0.1,http://front:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  # Celery Worker
  celery:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: scheduling-celery
    volumes:
      - ./api:/app
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DATABASE_URL: "postgres://${POSTGRES_USER:-scheduling}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-scheduling_db}"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A api worker -l INFO

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: scheduling-celery-beat
    volumes:
      - ./api:/app
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DATABASE_URL: "postgres://${POSTGRES_USER:-scheduling}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-scheduling_db}"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A api beat -l INFO

  # Next.js Frontend (internal only - accessed via nginx)
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: scheduling-front
    volumes:
      - ./front:/app
      - /app/node_modules
      - /app/.next
    # No ports exposed to host - accessed via nginx
    expose:
      - "3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost/api"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
