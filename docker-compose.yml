# Local development: PostgreSQL + Django (runserver) + Next.js (dev server)
#   docker compose up --build
#   -> http://localhost:3000 (front) / http://localhost:8000/api/docs/ (API docs)

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: scheduling_db
      POSTGRES_USER: scheduling
      POSTGRES_PASSWORD: scheduling_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduling -d scheduling_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: "django-insecure-dev-key"
      DATABASE_URL: "postgres://scheduling:scheduling_password@db:5432/scheduling_db"
      ALLOWED_HOSTS: "localhost,127.0.0.1,api"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      FRONTEND_URL: "http://localhost:3000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  # Next.js Frontend
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./front:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      API_INTERNAL_URL: "http://api:8000"
    depends_on:
      - api

volumes:
  postgres_data:
