# Development reverse proxy (RFC-0007): everything is served from http://localhost
#   /            -> Next.js (front:3000)
#   /api, /admin, /static/ -> Django (api:8000)
#   /keycloak    -> Keycloak (only when started with `--profile sso`)

server {
    listen 80;
    server_name localhost;

    # Resolve upstreams at request time so nginx starts even if optional services (keycloak) are not running
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $front_upstream http://front:3000;
    set $api_upstream http://api:8000;
    set $keycloak_upstream http://keycloak:8080;

    client_max_body_size 5m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Frontend (Next.js dev server, incl. HMR websocket)
    location / {
        proxy_pass $front_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API / admin / static (Django)
    location /api/ {
        proxy_pass $api_upstream;
    }

    location /admin/ {
        proxy_pass $api_upstream;
    }

    location /static/ {
        proxy_pass $api_upstream;
    }

    # Keycloak Identity Provider (RFC-0011, optional)
    location /keycloak/ {
        proxy_pass $keycloak_upstream;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
