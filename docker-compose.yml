version: '3.8'

services:
  # Nginx Reverse Proxy (RFC-0007)
  nginx:
    image: nginx:alpine
    container_name: scheduling-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - front
      - keycloak
    restart: unless-stopped

  # PostgreSQL Database (internal only - no external port binding)
  db:
    image: postgres:15-alpine
    container_name: scheduling-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scheduling_db}
      POSTGRES_USER: ${POSTGRES_USER:-scheduling}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    # No ports exposed to host - internal network only
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scheduling} -d ${POSTGRES_DB:-scheduling_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (internal only - no external port binding)
  redis:
    image: redis:7-alpine
    container_name: scheduling-redis
    # No ports exposed to host - internal network only
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak PostgreSQL Database (RFC-0011)
  keycloak-db:
    image: postgres:15-alpine
    container_name: scheduling-keycloak-db
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak Identity Provider (RFC-0011)
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: scheduling-keycloak
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PATH: /keycloak
      KC_HTTP_RELATIVE_PATH: /keycloak
      KC_PROXY: edge
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      # Google OAuth (for Google IdP)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    command: start --proxy edge --hostname-strict=false --import-realm
    depends_on:
      keycloak-db:
        condition: service_healthy
    # Internal only - no ports exposed to host
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/keycloak/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Django Backend (internal only - accessed via nginx)
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: scheduling-api
    volumes:
      - ./api:/app
    # No ports exposed to host - accessed via nginx
    expose:
      - "8000"
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DATABASE_URL: "postgres://${POSTGRES_USER:-scheduling}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-scheduling_db}"
      REDIS_URL: "redis://redis:6379/0"
      ALLOWED_HOSTS: "localhost,127.0.0.1,api,nginx"
      CORS_ALLOWED_ORIGINS: "http://localhost,http://127.0.0.1,http://front:3000"
      # Keycloak settings (RFC-0011)
      KEYCLOAK_URL: "http://keycloak:8080/keycloak"
      KEYCLOAK_REALM: "scheduling-tool"
      KEYCLOAK_CLIENT_ID: "scheduling-backend"
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_BACKEND_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  # Celery Worker
  celery:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: scheduling-celery
    volumes:
      - ./api:/app
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DATABASE_URL: "postgres://${POSTGRES_USER:-scheduling}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-scheduling_db}"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A api worker -l INFO

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: scheduling-celery-beat
    volumes:
      - ./api:/app
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DATABASE_URL: "postgres://${POSTGRES_USER:-scheduling}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-scheduling_db}"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A api beat -l INFO

  # Next.js Frontend (internal only - accessed via nginx)
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: scheduling-front
    volumes:
      - ./front:/app
      - /app/node_modules
      - /app/.next
    # No ports exposed to host - accessed via nginx
    expose:
      - "3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost"
      NEXT_PUBLIC_KEYCLOAK_URL: "http://localhost/keycloak"
      NEXT_PUBLIC_KEYCLOAK_REALM: "scheduling-tool"
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: "scheduling-frontend"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  keycloak_postgres_data:

