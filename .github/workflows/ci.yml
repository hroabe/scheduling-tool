name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: scheduling_db
          POSTGRES_USER: scheduling
          POSTGRES_PASSWORD: scheduling_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: ./api

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r ../requirements.txt

    - name: Run Tests
      env:
        SECRET_KEY: test-secret-key
        DATABASE_URL: postgres://scheduling:scheduling_password@localhost:5432/scheduling_db
        REDIS_URL: redis://localhost:6379/0
      run: |
        python manage.py test

  frontend-check:
    name: Frontend Check (Lint & Unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'yarn'
        cache-dependency-path: front/yarn.lock

    - name: Install Dependencies
      run: yarn install

    - name: Lint
      run: yarn lint

    - name: Type Check
      run: yarn type-check

    - name: Unit Tests
      run: yarn test

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-check]
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: scheduling_db
          POSTGRES_USER: scheduling
          POSTGRES_PASSWORD: scheduling_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Backend Deps
      working-directory: ./api
      run: |
        python -m pip install --upgrade pip
        pip install -r ../requirements.txt

    - name: Initialize Backend
      working-directory: ./api
      env:
        SECRET_KEY: test-secret-key
        DATABASE_URL: postgres://scheduling:scheduling_password@localhost:5432/scheduling_db
        REDIS_URL: redis://localhost:6379/0
      run: |
        python manage.py migrate
        # Create a test user if needed, or rely on test fixtures

    - name: Start Backend
      working-directory: ./api
      env:
        SECRET_KEY: test-secret-key
        DATABASE_URL: postgres://scheduling:scheduling_password@localhost:5432/scheduling_db
        REDIS_URL: redis://localhost:6379/0
      run: |
        python manage.py runserver 0.0.0.0:8000 &
        echo "Backend starting..."
        npx wait-on http://localhost:8000/api/v1/schedules/ --timeout 60000 || echo "Backend may not be fully ready"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'yarn'
        cache-dependency-path: front/yarn.lock

    - name: Install Frontend Deps
      working-directory: ./front
      run: yarn install

    - name: Install Playwright Browsers
      working-directory: ./front
      run: npx playwright install --with-deps

    - name: Build Frontend
      working-directory: ./front
      env:
        NEXT_PUBLIC_API_URL: http://localhost:8000
      run: yarn build

    - name: Start Frontend
      working-directory: ./front
      env:
        NEXT_PUBLIC_API_URL: http://localhost:8000
      run: |
        yarn start &
        echo "Frontend starting..."
        npx wait-on http://localhost:3000

    - name: Run E2E Tests
      working-directory: ./front
      continue-on-error: true
      env:
        CI: true
      run: yarn test:e2e


